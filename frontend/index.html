<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mağazada yardım isteme provası</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ========== SAYFA DÜZENİ VE ARAYÜZ ========== */
  :root {
    --arkaplan: #e9efee;  --yuzey: #ffffff;  --metin: #23302e;  --soluk: #6b7c78;  --vurgu: #2f6f73;
    --kazak: #c9973f;  --kazak-koyu: #a87a2c;  --kot: #4a6185;  --kot-koyu: #3a4e6e;
    --sac-m: #2e2420;  --sac-m-acik: #4a3a33;
  }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme: dark;
      --arkaplan: #1b2423;  --yuzey: #26312f;  --metin: #e6eeec;  --soluk: #9fb0ac;  --vurgu: #7cc0c4; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 16px;
    display: flex; justify-content: center;
    background: var(--arkaplan); color: var(--metin);
    font-family: "Nunito", "Segoe UI", system-ui, sans-serif;
  }
  .sayfa { width: min(1100px, 100%); display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .cerceve { width: 100%; overflow: hidden; border-radius: 16px; position: relative; }
  #sahne { display: block; width: 100%; height: auto; }
  #sahne text { font-family: "Nunito", "Segoe UI", system-ui, sans-serif; }

  .ust-satir { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: center; align-items: center; font-size: .9rem; }
  .ust-satir b { font-weight: 700; }

  /* Rehber: sahnenin sağ üst köşesinde, yüzey renginde yumuşak bir kart (altyazı altta) */
  .rehber {
    position: absolute; right: 14px; top: 14px;
    width: max-content; max-width: min(400px, calc(100% - 28px));
    padding: 12px 18px 14px; border-radius: 16px;
    background: var(--yuzey); border: 2px solid var(--vurgu);
    box-shadow: 0 4px 16px rgba(16, 22, 26, .3); pointer-events: none;
  }
  .rehber:has(.adim:empty) { display: none; }
  .rehber-baslik {
    display: flex; align-items: center; gap: 6px; margin: 0 0 4px;
    font-size: .75rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--vurgu);
  }
  .rehber-baslik svg { width: 16px; height: 16px; flex: none; }
  .adim { margin: 0; font-weight: 700; color: var(--metin); font-size: 1.15rem; line-height: 1.45; }
  /* İpucu ("Sen: …", "Dinliyorum…") sahnenin dışında, altta kalır */
  .ipucu { margin: 0; color: var(--soluk); font-size: .95rem; text-align: center; min-height: 1.4em; }
  .altyazi {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    max-width: 80%; padding: 8px 14px; border-radius: 10px;
    background: rgba(20, 28, 27, .78); color: #fff; font-size: 1.05rem; line-height: 1.45;
    display: none;
  }
  .altyazi.gorunur { display: block; }
  .altyazi:empty { display: none; }

  .panel { width: min(640px, 100%); display: none; flex-direction: column; gap: 10px; }
  .panel.acik { display: flex; }
  .cipler { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .cip {
    padding: 8px 14px; border-radius: 999px; border: 1px solid var(--vurgu);
    background: var(--yuzey); color: var(--metin); font: inherit; font-size: .95rem; cursor: pointer;
  }
  .cip.onarim { border-style: dashed; border-color: var(--soluk); font-size: .85rem; padding: 6px 12px; }
  .giris { display: flex; gap: 8px; }
  .giris input {
    flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--soluk);
    background: var(--yuzey); color: var(--metin); font: inherit;
  }
  .ana-buton {
    padding: 10px 18px; border: 0; border-radius: 10px; cursor: pointer;
    background: var(--vurgu); color: var(--yuzey); font: inherit; font-weight: 700;
  }
  .ana-buton[hidden] { display: none; }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 3px solid var(--vurgu); outline-offset: 2px; }

  /* ========== KAMERA: dünya grubu ve perde ========== */
  /* "Kamera" aslında hareket etmiyor: çekimler arasında perde kapanırken dünya yeni ölçeğe alınıyor */
  .dunya { transform-origin: 0 0; }
  .perde { fill: #10161a; opacity: 1; transition: opacity .6s ease; pointer-events: none; }
  .perde.acik { opacity: 0; }
  .reyon { cursor: default; }
  /* Yakın çekimde görevli, özel bir jest yapmıyorsa müşteriye (sağa) bakar */
  .yakin .karakter:not([data-jest="isaret"]):not([data-durum="dusunuyor"]) .bakis { transform: translate(1.6px, .3px); }

  /* ========== MÜŞTERİ (kullanıcının avatarı, arkadan) ========== */
  .musteri-konum { transform-origin: 0 0; }
  .musteri-konum.yuru { transition: transform var(--yurume-suresi, 2.6s) cubic-bezier(.4, 0, .4, 1); }
  .kazak { fill: var(--kazak); }
  .ribana { fill: var(--kazak-koyu); }
  .yaka-arka { fill: var(--kazak-koyu); }
  .kol-kazak { stroke: var(--kazak); stroke-linecap: round; }
  .manset { stroke: var(--kazak-koyu); stroke-linecap: butt; }
  .kot { fill: var(--kot); }
  .ayakkabi-arka { fill: #f1eee7; }
  .taban-arka { fill: #c9c3b6; }
  .sac-m { fill: var(--sac-m); }
  .tel-m { fill: none; stroke: var(--sac-m-acik); stroke-width: 1.6; stroke-linecap: round; opacity: .8; }

  /* Yürüme: bacaklar sırayla kalkar, kollar hafif sallanır, gövde aşağı yukarı iner */
  .bacak.sol { transform-origin: 104px 250px; }
  .bacak.sag { transform-origin: 136px 250px; }
  .yuruyor .bacak.sol { animation: adim .7s ease-in-out infinite; }
  .yuruyor .bacak.sag { animation: adim .7s ease-in-out infinite -.35s; }
  .yuruyor .kol.sol   { animation: kol-salla .7s ease-in-out infinite; }
  .yuruyor .kol.sag   { animation: kol-salla .7s ease-in-out infinite -.35s; }
  .yuruyor .ust-govde { animation: zipla-yuru .35s ease-in-out infinite; }
  @keyframes adim {
    0%, 100% { transform: translateY(0) scaleY(1); }
    25%      { transform: translateY(-7px) scaleY(.96); }
    50%      { transform: translateY(0) scaleY(1); }
  }
  @keyframes kol-salla {
    0%, 100% { transform: rotate(-5deg); }
    50%      { transform: rotate(5deg); }
  }
  @keyframes zipla-yuru {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3px); }
  }

  /* ========== GÖREVLİNİN DÖNMESİ ========== */
  /* Arkadan ve önden çizim üst üste duruyor; dönerken kap yatayda daralıp tekrar açılıyor,
     tam ortada arka çizim gizlenip ön çizim gösteriliyor. */
  .gorevli-kap { transition: transform .22s ease-in-out; }
  .gorevli-kap.don { transform: scaleX(.5); }
  .gorevli-kap.arkasi-donuk #gorevli,
  .gorevli-kap:not(.arkasi-donuk) #gorevliArka { visibility: hidden; }
  .fiyonk { fill: var(--onluk); }

  /* Raf düzenleme: sağ kol rafa uzanıp geri iner */
  .karakter-arka.duzenliyor .kol.sag   { animation: raf-kol 3.4s ease-in-out infinite; }
  .karakter-arka.duzenliyor .onkol.sag { animation: raf-onkol 3.4s ease-in-out infinite; }
  @keyframes raf-kol   { 0%, 100% { transform: rotate(0); } 30%, 70% { transform: rotate(-150deg); } 50% { transform: rotate(-140deg); } }
  @keyframes raf-onkol { 0%, 100% { transform: rotate(0); } 30%, 70% { transform: rotate(-25deg); } 50% { transform: rotate(-10deg); } }

  /* ========== DİĞER MÜŞTERİLER ========== */
  #sahne:not(.kalabalik-acik) .kalabalik { display: none; }
  .bisiklet-yaka { fill: none; stroke: var(--gomlek-koyu); stroke-width: 2.5; stroke-linecap: round; }
  .sepet-k { fill: #c4575a; stroke: #9d3f43; stroke-width: 1.5; }
  .sepet-ag-k { fill: none; stroke: #9d3f43; stroke-width: 1.2; }
  .sepet-sap-k { fill: none; stroke: #3a352e; stroke-width: 2.4; stroke-linecap: round; }
  .kutu { fill: #e3c27f; stroke: #b9964f; stroke-width: 1; }  .kutu-etiket { fill: #fff; }
  /* Detaylı seviyede ortak gradyanlar herkesi aynı renge boyardı; müşteriler kendi renklerini kullansın */
  [data-seviye="3"] .npc .yuz { fill: var(--ten); }
  [data-seviye="3"] .npc .gomlek { fill: var(--gomlek); }
  [data-seviye="3"] .npc .pantolon { fill: var(--pantolon); }
  [data-seviye="3"] .npc .sac { fill: var(--sac); }
  [data-seviye="3"] .npc .sac-k { fill: var(--sac-k); }
  /* Ürün okuyan müşteri: sağ eli göğüs hizasında, gözleri aşağıda */
  #npc1 .kol.sag   { transform: rotate(18deg); }
  #npc1 .onkol.sag { transform: rotate(120deg); }
  #npc1 .el.sag    { transform: rotate(-30deg); }
  #npc1 .bakis     { transform: translate(-.6px, 1.6px); }
  .npc[data-kirp="1"] .goz { transform: scaleY(.08); }

  /* ========== SAĞA İŞARET ========== */
  .karakter[data-jest="isaret-sag"] .kol.sag   { transform: rotate(-55deg); }
  .karakter[data-jest="isaret-sag"] .onkol.sag { transform: rotate(-10deg); }
  .karakter[data-jest="isaret-sag"] .parmak-sag { opacity: 1; }
  .karakter:not([data-jest="isaret-sag"]) .parmak-sag { opacity: 0 !important; }
  .karakter[data-jest="isaret-sag"] .kafa  { transform: rotate(4deg); }
  .karakter[data-jest="isaret-sag"] .bakis { transform: translate(2px, .5px); }

  /* ========== BAŞKA MÜŞTERİYLE SOHBET ========== */
  #sahne:not(.mod-konusma) #sohbetKap { display: none; }
  .sohbet-kap { transition: transform 2.6s cubic-bezier(.4, 0, .4, 1), opacity 1s ease 1.8s; }
  .sohbet-kap.gitti { transform: translate(-330px, -46px); opacity: 0; }
  .sohbet-kap:not(.gitti) .kafa { animation: onay 2.4s ease-in-out infinite; }
  .gorevli-kap.sohbette #gorevli .bakis { transform: translate(-2.2px, .3px); }

  /* ========== ÜRÜN VURGUSU ========== */
  .urun-vurgu { fill: #f2b544; fill-opacity: .12; stroke: #f2b544; stroke-width: 4; opacity: 0; }
  .urun-vurgu.gorunur { opacity: 1; animation: nabiz 1.6s ease-in-out infinite; }
  @keyframes nabiz { 0%, 100% { stroke-opacity: 1; } 50% { stroke-opacity: .35; } }

  /* ========== ÜRÜN SEÇME VE BİTİŞ EKRANLARI ========== */
  .kaplama {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    padding: 16px; background: rgba(16, 22, 26, .55);
  }
  .kaplama.acik { display: flex; }
  .kutu-panel {
    width: min(620px, 100%); max-height: 100%; overflow: auto;
    background: var(--yuzey); color: var(--metin); border-radius: 18px; padding: 18px 20px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .kutu-panel[hidden] { display: none; }
  .kutu-panel h2 { margin: 0; font-size: 1.2rem; }
  .kutu-panel p { margin: 0; line-height: 1.5; }
  .urun-kartlari { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .urun-karti {
    display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 8px;
    border: 2px solid transparent; border-radius: 14px; background: var(--arkaplan);
    color: var(--metin); font: inherit; cursor: pointer; text-align: center;
  }
  .urun-karti:hover, .urun-karti:focus-visible { border-color: var(--vurgu); }
  .urun-karti svg { width: 56px; height: 56px; }
  .urun-karti b { font-size: 1rem; }
  .urun-karti span { font-size: .85rem; color: var(--soluk); }
  .ozet { margin: 0; padding-left: 20px; line-height: 1.7; }

  .bekleme { width: min(320px, 100%); height: 8px; border-radius: 99px; background: var(--yuzey); overflow: hidden; display: none; }
  .bekleme.acik { display: block; }
  .bekleme i { display: block; height: 100%; width: 0; background: var(--vurgu); }
  .bekleme.acik i { animation: dol var(--bekleme, 6s) linear forwards; }
  @keyframes dol { to { width: 100%; } }

  details.ayarlar { width: min(760px, 100%); font-size: .9rem; }
  details.ayarlar summary { cursor: pointer; text-align: center; color: var(--soluk); }
  details.ayarlar .ust-satir { margin-top: 8px; }
  select { font: inherit; padding: 2px 6px; border-radius: 6px; }

  /* ========== FRONTEND EKLERİ ========== */
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .ust-satir label select { margin-left: 6px; }
  .not { margin: 8px 0 0; text-align: center; color: var(--soluk); font-size: .85rem; }
  .mesgul-notu { margin: 0; color: var(--soluk); font-size: .9rem; }
  .mesgul-notu[hidden] { display: none; }
  .duzeltme { padding: 10px 12px; border-radius: 12px; background: var(--yuzey); border: 1px dashed var(--vurgu); }
  .duzeltme[hidden] { display: none; }
  .duzeltme p { margin: 0 0 8px; text-align: center; }
  .mikrofon {
    flex: 0 0 auto; width: 46px; border-radius: 10px; border: 1px solid var(--vurgu);
    background: var(--yuzey); color: var(--vurgu); cursor: pointer; touch-action: none;
    display: grid; place-items: center;
  }
  .mikrofon svg { width: 22px; height: 22px; fill: currentColor; }
  .mikrofon[hidden] { display: none; }
  .mikrofon.dinliyor { background: var(--vurgu); color: var(--yuzey); }
  @media (prefers-reduced-motion: no-preference) {
    .mikrofon.dinliyor { animation: dinle 1.2s ease-in-out infinite; }
  }
  @keyframes dinle { 0%, 100% { box-shadow: 0 0 0 0 var(--vurgu); } 50% { box-shadow: 0 0 0 5px transparent; } }

  /* ========== KARAKTER KURALLARI (görevli dosyasından) ========== */
  
  /* =========================================================
     1. RENKLER
     ========================================================= */
  :root {
    --arkaplan: #e9efee;  --yuzey: #ffffff;  --metin: #23302e;  --soluk: #6b7c78;  --vurgu: #2f6f73;

    --ten-acik: #f3cfa9;  --ten: #e6b48a;  --ten-golge: #c99369;  --yanak: #e0857c;
    --sac-acik: #6a4a38;  --sac: #3f2c25;
    --sac-k-acik: #a1613d; --sac-k: #6b3a24;
    --iris: #5a4632;  --cizgi: #2b211b;  --goz-aki: #fbfaf7;
    --agiz-ici: #6e2a27;  --dil: #d46b67;  --dis: #fbfaf7;
    --dudak: #c78c74;  --dudak-alt: #d39a82;  --dudak-k: #c45f68;  --dudak-k-alt: #d4777e;
    --burun-delik: #8f5c40;  --kupe: #d4ad4a;
    --gomlek-acik: #4f979b;  --gomlek: #3f7f83;  --gomlek-koyu: #2e6064;
    --onluk-acik: #376a6d;   --onluk: #2a5457;   --onluk-koyu: #1e3f42;
    --yaka: #eef1ec;
    --pantolon-acik: #4b5468;  --pantolon: #3a4152;  --pantolon-koyu: #2a303d;
    --ayakkabi: #23262d;  --taban: #ece8e0;  --bagcik: #d6d2ca;
  }
  

  
  
  

  
  
  
  
  
  
  

  /* =========================================================
     2. GERÇEKÇİLİK SEVİYELERİ
     Her parça hangi seviyelerde görüneceğini sınıfıyla söyler:
       .s1  → sadece Sade        .s12 → Sade ve Orta
       .s2p → Orta ve Detaylı    .s3  → sadece Detaylı
     Sınıfı olmayan parçalar her seviyede görünür.
     ========================================================= */
  [data-seviye="1"] .s2p, [data-seviye="1"] .s3,
  [data-seviye="2"] .s1,  [data-seviye="2"] .s3,
  [data-seviye="3"] .s1,  [data-seviye="3"] .s12 { display: none; }

  /* Gradyan sadece Detaylı seviyede, diğerlerinde düz renk */
  .yuz      { fill: var(--ten); }       [data-seviye="3"] .yuz      { fill: url(#g-yuz); }
  .sac      { fill: var(--sac); }       [data-seviye="3"] .sac      { fill: url(#g-sac); }
  .sac-k    { fill: var(--sac-k); }     [data-seviye="3"] .sac-k    { fill: url(#g-sac-k); }
  .gomlek   { fill: var(--gomlek); }    [data-seviye="3"] .gomlek   { fill: url(#g-gomlek); }
  .onluk    { fill: var(--onluk); }     [data-seviye="3"] .onluk    { fill: url(#g-onluk); }
  .pantolon { fill: var(--pantolon); }  [data-seviye="3"] .pantolon { fill: url(#g-pantolon); }

  /* Gradyan durak renkleri */
  .d-ten-acik { stop-color: var(--ten-acik); }  .d-ten { stop-color: var(--ten); }  .d-ten-golge { stop-color: var(--ten-golge); }
  .d-sac-acik { stop-color: var(--sac-acik); }  .d-sac { stop-color: var(--sac); }
  .d-sac-k-acik { stop-color: var(--sac-k-acik); }  .d-sac-k { stop-color: var(--sac-k); }
  .d-gomlek-acik { stop-color: var(--gomlek-acik); } .d-gomlek { stop-color: var(--gomlek); } .d-gomlek-koyu { stop-color: var(--gomlek-koyu); }
  .d-onluk-acik { stop-color: var(--onluk-acik); }   .d-onluk { stop-color: var(--onluk); }   .d-onluk-koyu { stop-color: var(--onluk-koyu); }
  .d-pantolon-acik { stop-color: var(--pantolon-acik); } .d-pantolon { stop-color: var(--pantolon); } .d-pantolon-koyu { stop-color: var(--pantolon-koyu); }

  /* =========================================================
     3. PARÇA RENKLERİ
     ========================================================= */
  .ten { fill: var(--ten); }   .ten-golge { fill: var(--ten-golge); }
  .golge { fill: #000; opacity: .12; }
  .cene-golge { fill: #000; opacity: .1; }
  .yaka { fill: var(--yaka); }  .yanak { fill: var(--yanak); opacity: .22; }
  .goz-aki { fill: var(--goz-aki); }  .iris { fill: var(--iris); }  .bebek { fill: var(--cizgi); }  .parilti { fill: #fff; }
  .agiz-ici { fill: var(--agiz-ici); }  .dil { fill: var(--dil); }  .dis { fill: var(--dis); }
  .ince { fill: none; stroke: var(--cizgi); stroke-width: 1.4; stroke-linecap: round; }
  .agiz-cizgi { stroke-width: 1.8; }
  .kadin .agiz-cizgi { stroke: var(--dudak-k); stroke-width: 2.2; }
  .kas { fill: none; stroke: var(--sac); stroke-width: 2.6; stroke-linecap: round; }
  .kadin .kas { stroke: var(--sac-k); stroke-width: 1.9; }
  .kirpik { fill: none; stroke: var(--cizgi); stroke-width: 1.5; stroke-linecap: round; }
  .kapak { fill: none; stroke: var(--ten-golge); stroke-width: 1; stroke-linecap: round; }
  .tel { fill: none; stroke: var(--sac-acik); stroke-width: 1.4; stroke-linecap: round; opacity: .7; }
  .tel-k { fill: none; stroke: var(--sac-k-acik); stroke-width: 1.4; stroke-linecap: round; opacity: .7; }
  .kupe { fill: var(--kupe); }

  .burun-golge { fill: none; stroke: var(--ten-golge); stroke-width: 1.6; stroke-linecap: round; opacity: .8; }
  .burun-uc    { fill: none; stroke: var(--ten-golge); stroke-width: 1.3; stroke-linecap: round; }
  .burun-delik { fill: var(--burun-delik); }
  .parlama     { fill: #fff; opacity: .28; }

  .dudak-ust { fill: var(--dudak); }  .dudak-alt { fill: var(--dudak-alt); }
  .kadin .dudak-ust { fill: var(--dudak-k); }  .kadin .dudak-alt { fill: var(--dudak-k-alt); }
  [data-seviye="3"] .agiz-ici { stroke: var(--dudak); stroke-width: 1.6; }
  [data-seviye="3"] .kadin .agiz-ici { stroke: var(--dudak-k); stroke-width: 2; }

  .kivrim { fill: none; stroke: #000; stroke-width: 1.2; stroke-linecap: round; opacity: .14; }
  .dikis { fill: none; stroke: var(--onluk-koyu); stroke-width: 1.2; }
  .aski { stroke: var(--onluk); stroke-width: 5; stroke-linecap: round; }
  .kol-ten { stroke: var(--ten); stroke-linecap: round; fill: none; }
  .parmak-cizgi { fill: none; stroke: var(--ten-golge); stroke-width: .9; stroke-linecap: round; }
  .rozet { fill: var(--goz-aki); }
  .rozet-yazi { fill: #23302e; font-size: 6px; font-weight: 700; }
  .dugme { fill: var(--gomlek-koyu); }
  .nokta { fill: var(--soluk); }
  .parmak { stroke: var(--ten); stroke-width: 5; stroke-linecap: round; opacity: 0; transition: opacity .3s; }

  .ayakkabi { fill: var(--ayakkabi); }  .taban { fill: var(--taban); }
  .dil-ayk { fill: #3d4454; }
  .bagcik { fill: none; stroke: var(--bagcik); stroke-width: 1.4; stroke-linecap: round; }
  .taban-cizgi { fill: none; stroke: #000; stroke-width: .8; opacity: .18; }

  /* =========================================================
     4. EKLEMLER
     Omuzdaki .omuz dairesi tam dönme noktasında duruyor:
     merkezinden dönen bir daire hiç değişmiyormuş gibi görünür,
     bu yüzden kol hangi açıda olursa olsun birleşim yeri hep yuvarlak kalır.
     ========================================================= */
  :root { --eklem-egri: cubic-bezier(.45, 0, .25, 1); }
  .kol   { transition: transform .6s var(--eklem-egri); }
  .onkol { transition: transform .6s var(--eklem-egri) .08s; }
  .el    { transition: transform .6s var(--eklem-egri) .16s; }

  .kol.sol   { transform-origin: 80px 130px; }   .kol.sag   { transform-origin: 160px 130px; }
  .onkol.sol { transform-origin: 73px 204px; }   .onkol.sag { transform-origin: 167px 204px; }
  .el.sol    { transform-origin: 70px 268px; }   .el.sag    { transform-origin: 170px 268px; }

  .ust-govde    { animation: nefes 4.2s ease-in-out infinite; }
  .kafa-salinim { transform-origin: 120px 104px; animation: salinim 7s ease-in-out infinite; }
  .kadin .ust-govde    { animation-delay: -1.3s; }
  .kadin .kafa-salinim { animation-delay: -2.5s; }
  @keyframes nefes   { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(1.4px); } }
  @keyframes salinim { 0%, 100% { transform: rotate(-.8deg); } 50% { transform: rotate(.8deg); } }

  /* =========================================================
     5. YÜZ
     ========================================================= */
  .kafa  { transform-origin: 120px 104px; transition: transform .5s var(--eklem-egri); }
  .kas   { transition: transform .35s ease; }
  .bakis { transition: transform .35s ease; }

  .goz.sol { transform-origin: 106px 60px; transition: transform 70ms; }
  .goz.sag { transform-origin: 134px 60px; transition: transform 70ms; }
  .karakter[data-kirp="1"] .goz { transform: scaleY(.08); }

  .gulumseme { transition: opacity 80ms; }
  .acik-agiz { transform-origin: 120px 84px; transform: scale(1, 0); transition: transform 80ms; }
  .agiz.a .acik-agiz { transform: scale(1, 1); }
  .agiz.o .acik-agiz { transform: scale(.6, .95); }
  .agiz.e .acik-agiz { transform: scale(1.1, .5); }
  .agiz.a .gulumseme, .agiz.o .gulumseme, .agiz.e .gulumseme { opacity: 0; }

  .noktalar { opacity: 0; transition: opacity .3s; }
  .nokta { animation: zipla 1s infinite; }
  .nokta:nth-child(2) { animation-delay: .15s; }
  .nokta:nth-child(3) { animation-delay: .3s; }
  @keyframes zipla { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }

  /* =========================================================
     6. DURUMLAR VE JESTLER (iki karakterde de aynı iskelet)
     ========================================================= */
  .karakter[data-durum="dusunuyor"] .kafa      { transform: rotate(-5deg); }
  .karakter[data-durum="dusunuyor"] .kas.sol   { transform: translateY(-3px); }
  .karakter[data-durum="dusunuyor"] .bakis     { transform: translate(1.8px, -1.6px); }
  .karakter[data-durum="dusunuyor"] .noktalar  { opacity: 1; }
  .karakter[data-durum="dusunuyor"] .kol.sag   { transform: rotate(22deg); }
  .karakter[data-durum="dusunuyor"] .onkol.sag { transform: rotate(150deg); }
  .karakter[data-durum="dusunuyor"] .el.sag    { transform: rotate(-15deg); }

  .karakter[data-jest="isaret"] .kol.sol   { transform: rotate(55deg); }
  .karakter[data-jest="isaret"] .onkol.sol { transform: rotate(10deg); }
  .karakter[data-jest="isaret"] .parmak    { opacity: 1; }
  .karakter[data-jest="isaret"] .bakis     { transform: translate(-2px, .5px); }
  .karakter[data-jest="isaret"] .kafa      { transform: rotate(-4deg); }

  .karakter[data-jest="bekle"] .kol.sag   { transform: rotate(-30deg); }
  .karakter[data-jest="bekle"] .onkol.sag { transform: rotate(-147deg); }
  .karakter[data-jest="bekle"] .kas       { transform: translateY(-1.5px); }

  .karakter[data-jest="omuz"] .kol.sol   { transform: rotate(4deg); }
  .karakter[data-jest="omuz"] .onkol.sol { transform: rotate(105deg); }
  .karakter[data-jest="omuz"] .el.sol    { transform: rotate(35deg); }
  .karakter[data-jest="omuz"] .kol.sag   { transform: rotate(-4deg); }
  .karakter[data-jest="omuz"] .onkol.sag { transform: rotate(-105deg); }
  .karakter[data-jest="omuz"] .el.sag    { transform: rotate(-35deg); }
  .karakter[data-jest="omuz"] .kas       { transform: translateY(-3px); }
  .karakter[data-jest="omuz"] .kafa      { transform: rotate(5deg); }

  .karakter[data-jest="anlat"] .kol.sol   { transform: rotate(6deg); }
  .karakter[data-jest="anlat"] .onkol.sol { animation: anlat 2.2s var(--eklem-egri) infinite; }
  .karakter[data-jest="anlat"] .kafa      { animation: onay 2.2s ease-in-out infinite; }
  @keyframes anlat {
    0%, 100% { transform: rotate(0deg); }
    30%      { transform: rotate(-72deg); }
    55%      { transform: rotate(-90deg); }
    80%      { transform: rotate(-70deg); }
  }
  @keyframes onay { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(2deg); } }

  /* =========================================================
     7. KONTROLLER
     ========================================================= */
  
  
  
  
  
  
  
  
  

  @media (prefers-reduced-motion: reduce) {
    .nokta, .ust-govde, .kafa-salinim,
    .karakter[data-jest="anlat"] .onkol.sol, .karakter[data-jest="anlat"] .kafa { animation: none; }
    .kol, .onkol, .el, .kafa, .kas, .bakis, .acik-agiz, .gulumseme, .parmak { transition: none; }
  }


  /* ========== MARKET KURALLARI (market dosyasından) ========== */
  
  /* =========================================================
     1. RENKLER
     Arayüz temaya göre değişir; sahne bir çizim olduğu için sabit.
     ========================================================= */
  :root {
    --arkaplan: #e9efee;  --yuzey: #ffffff;  --metin: #23302e;  --soluk: #6b7c78;  --vurgu: #2f6f73;

    --tavan: #dfe3e1;  --lamba: #fffdf4;
    --duvar: #efe9de;  --duvar-koyu: #e3dccd;  --supurgelik: #c9c0ae;
    --zemin: #d9d4c9;  --zemin-koyu: #c7c1b4;  --karo: #c2bbad;
    --dolap: #b9c2c4;  --dolap-cam: #d9eef2;  --dolap-cam-koyu: #bcdbe2;  --dolap-raf: #9fb0b4;
    --reyon: #e8e6e0;  --reyon-yan: #cfccc3;  --reyon-panel: #f6f4ef;  --raf: #9a9488;  --kaide: #6f6a61;
    --tabela-zemin: #2f6f73;
    --r1: #5b7fa6;  --r2: #c08b3e;  --r3: #4f8f8a;  --r4: #7d9a5a;  --r5: #b06f7e;
    --u1: #5b7fa6;  --u2: #d39a4a;  --u3: #c4575a;  --u4: #6f9e6a;  --u5: #8a74a8;
    --etiket: #fbfaf6;  --pil: #3a3f4b;  --pil-uc: #c9b26a;
    --kasa: #3e5c5f;  --kasa-ust: #2c4446;  --bant: #2b2f36;  --ekran: #2b2f36;  --ekran-ic: #8fd0c8;
    --sepet: #c4575a;  --sepet-koyu: #9d3f43;
    --yaprak: #6f9e6a;  --yaprak-koyu: #4f7d4c;  --saksi: #b9835a;
    --vurgu-sahne: #f2b544;
  }
  

  
  
  
  
  
  

  /* =========================================================
     2. GERÇEKÇİLİK SEVİYELERİ (karakterlerle aynı sistem)
     .s1 sadece Sade · .s2p Orta ve Detaylı · .s3 sadece Detaylı
     ========================================================= */
  [data-seviye="1"] .s2p, [data-seviye="1"] .s3,
  [data-seviye="2"] .s1,  [data-seviye="2"] .s3,
  [data-seviye="3"] .s1 { display: none; }

  .duvar { fill: var(--duvar); }      [data-seviye="3"] .duvar { fill: url(#g-duvar); }
  .zemin { fill: var(--zemin); }      [data-seviye="3"] .zemin { fill: url(#g-zemin); }
  .dolap-cam { fill: var(--dolap-cam); } [data-seviye="3"] .dolap-cam { fill: url(#g-cam); }
  .kapi-cam { fill: var(--dolap-cam); }  [data-seviye="3"] .kapi-cam { fill: url(#g-cam); }

  .d-duvar { stop-color: var(--duvar); }  .d-duvar-koyu { stop-color: var(--duvar-koyu); }
  .d-zemin { stop-color: var(--zemin); }  .d-zemin-koyu { stop-color: var(--zemin-koyu); }
  .d-cam   { stop-color: var(--dolap-cam); } .d-cam-koyu { stop-color: var(--dolap-cam-koyu); }

  /* =========================================================
     3. PARÇA RENKLERİ
     ========================================================= */
  .tavan { fill: var(--tavan); }  .lamba { fill: var(--lamba); }
  .isik-havuzu { fill: #fffbe8; opacity: .45; }
  .supurgelik { fill: var(--supurgelik); }
  .tabela-zemin { fill: var(--tabela-zemin); }

  .kucuk-tabela.acik { fill: #fff; }
  .saat { fill: #fff; stroke: #6b6458; stroke-width: 2; }
  .saat-kol { fill: none; stroke: #3a352e; stroke-width: 1.8; stroke-linecap: round; }

  .dolap-govde { fill: var(--dolap); }  .dolap-ust { fill: #8d999c; }
  .dolap-raf { fill: var(--dolap-raf); }
  .dolap-urun { opacity: .75; }
  .dolap-parlama { fill: #fff; opacity: .35; }
  .kapi-kasa { fill: #8d999c; }

  .karo { stroke: var(--karo); stroke-width: 1; }
  .zemin-parlama { fill: url(#g-parlama); }

  .u1 { fill: var(--u1); } .u2 { fill: var(--u2); } .u3 { fill: var(--u3); } .u4 { fill: var(--u4); } .u5 { fill: var(--u5); }
  .r1-renk { fill: var(--r1); } .r2-renk { fill: var(--r2); } .r3-renk { fill: var(--r3); } .r4-renk { fill: var(--r4); } .r5-renk { fill: var(--r5); }

  .uc-yuz { fill: var(--reyon); }  .yan-yuz { fill: var(--reyon-yan); }
  .arka-panel { fill: var(--reyon-panel); }
  .raf { fill: var(--raf); }  .yan-raf { stroke: var(--raf); stroke-width: 3; }
  .kaide { fill: var(--kaide); }
  
  .etiket { fill: var(--etiket); opacity: .85; }
  .fiyat { fill: #fff; stroke: #c9c3b6; stroke-width: .6; }
  .pil { fill: var(--pil); }  .pil-uc { fill: var(--pil-uc); }
  .kanca, .sap { fill: none; stroke: #4b4f4a; stroke-width: 1.6; stroke-linecap: round; }
  .katlama { fill: none; stroke: #fff; stroke-width: 1; opacity: .5; }
  .kapak-sise { fill: #f4f2ec; }
  .ambalaj.seffaf { fill: #ffffff; opacity: .7; stroke: #cfc9bc; stroke-width: .6; }
  .firca-kil { fill: #fff; }

  .ip { stroke: #9d968a; stroke-width: 1.2; }
  .tabela { stroke: rgba(0,0,0,.12); stroke-width: 1; }
  .numara-zemin { fill: #fff; }
  .numara { font-size: 15px; font-weight: 800; fill: #23302e; }
  .tabela-ad { font-size: 12.5px; font-weight: 800; fill: #fff; }

  .kasa-govde { fill: var(--kasa); }  .kasa-ust { fill: var(--kasa-ust); }
  .bant { fill: var(--bant); }  .bant-cizgi { stroke: #474c55; stroke-width: 1; }
  .direk { fill: #6b6458; }  .ekran { fill: var(--ekran); }  .ekran-ic { fill: var(--ekran-ic); }
  .kasa-panel { fill: #ffffff; opacity: .08; }

  .sepet { fill: var(--sepet); stroke: var(--sepet-koyu); stroke-width: 1.5; }
  .sepet-ag { fill: none; stroke: var(--sepet-koyu); stroke-width: 1.2; }
  .sepet-sap { fill: none; stroke: #3a352e; stroke-width: 2.4; stroke-linecap: round; }
  .yaprak { fill: var(--yaprak); }  .yaprak.koyu { fill: var(--yaprak-koyu); }  .saksi { fill: var(--saksi); }

  /* =========================================================
     4. ETKİLEŞİM: reyona dokununca vurgulanır
     ========================================================= */
  /* Reyon ürünleri: her reyon kendi başlık renginin üç tonunu kullanır (daha az renkli, daha uyumlu).
     Buzdolabı ürünleri etkilenmez. Eski renkli hâle dönmek için bu bloğu silmek yeterli. */
  .reyon[data-reyon="1"] { --rc: var(--r1); }  .reyon[data-reyon="2"] { --rc: var(--r2); }
  .reyon[data-reyon="3"] { --rc: var(--r3); }  .reyon[data-reyon="4"] { --rc: var(--r4); }
  .reyon[data-reyon="5"] { --rc: var(--r5); }
  .reyon {
    --u1: var(--rc);
    --u2: color-mix(in srgb, var(--rc) 62%, #fff);
    --u3: color-mix(in srgb, var(--rc) 78%, #000);
    --u4: var(--rc);
    --u5: color-mix(in srgb, var(--rc) 62%, #fff);
  }
  .reyon { cursor: default; outline: none; }
  .vurgu-cerceve { fill: none; stroke: var(--vurgu-sahne); stroke-width: 4; opacity: 0; transition: opacity .25s; }
  .reyon:focus-visible .vurgu-cerceve,
  .reyon.secili .vurgu-cerceve { opacity: 1; }
  .asili-tabela .tabela { transition: transform .25s; transform-box: fill-box; transform-origin: center; }
  .asili-tabela.secili .tabela { stroke: var(--vurgu-sahne); stroke-width: 3; }

  /* =========================================================
     5. KONTROLLER
     ========================================================= */
  
  
  
  
  


  @media (prefers-reduced-motion: reduce) {
    .yuruyor .bacak.sol, .yuruyor .bacak.sag,

    .sohbet-kap, .urun-vurgu { transition: none; animation: none; }
  }
</style>
